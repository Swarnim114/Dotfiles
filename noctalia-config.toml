[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "Main", "Leftbar" ]

    [bar.Leftbar]
    background_opacity = 0.90000000000000002
    border = "primary"
    capsule_fill = "on_secondary"
    capsule_opacity = 0.0
    center = [ "workspaces" ]
    enabled = false
    end = [ "tray", "clipboard", "notifications", "network", "battery" ]
    margin_edge = 4
    margin_ends = 6
    position = "left"
    radius = 0
    shadow = false
    start = [ "date", "clock", "media", "brightness", "volume", "screenshot", "wallpaper" ]
    thickness = 30

    [bar.Main]
    border = "on_surface"
    capsule_border = "primary"
    capsule_foreground = "primary"
    capsule_padding = 0.0
    capsule_radius = 15
    center = [ "pulse", "workspaces", "widget_2", "widget_3" ]
    end = [
        "tray",
        "todo",
        "status",
        "gamermode",
        "notifications",
        "clipboard",
        "volume",
        "brightness",
        "dns-switcher",
        "network",
        "battery"
    ]
    font_weight = 600
    margin_ends = 0
    padding = 4
    panel_overlap = 0
    radius = 0
    start = [ "clock", "date", "wallhaven", "widget", "media", "lrc" ]
    thickness = 30
    widget_spacing = 12

        [bar.Main.dead_zone.actions]
        back = "config-reload"
        middle = "settings-open"
        scroll_down = "volume-down"
        scroll_left = "brightness-up"
        scroll_right = "brightness-down"
        scroll_up = "volume-up"

